name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Monorepo (backend + web + shared): tip denetimi ve testler.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Landing kök npm workspace'i DEĞİL; kendi package-lock.json'ı var, bu yüzden
  # ayrı iş olarak ve kendi klasöründe kuruluyor.
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Landing bağımlılıklarını ve buildini doğrula
        working-directory: landing
        run: |
          npm ci
          npm run build

  # Üç imaj birbirinden bağımsız; matrix ile paralel derleniyor. Amaç imajı
  # yayımlamak değil, Dockerfile'ların bozulmadığını doğrulamak — asıl derleme
  # VPS'te cicd-deploy.sh içinde yapılıyor.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Actions cache'ine yazmak için gerekiyor (cache-to: type=gha).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
            build-args: ""
          - name: web
            dockerfile: Dockerfile.web
            build-args: VITE_API_URL=https://api.projelio.app
          - name: landing
            dockerfile: Dockerfile.landing
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: ${{ matrix.name }} imajını doğrula
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: false
          tags: projelio-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
