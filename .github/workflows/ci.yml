name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Docker imajlarını doğrula
        run: |
          docker build -f Dockerfile.backend -t projelio-backend:ci .
          docker build -f Dockerfile.web \
            --build-arg VITE_API_URL=http://api.193.111.77.252.sslip.io \
            -t projelio-web:ci .
