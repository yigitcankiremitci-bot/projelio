apply plugin: 'com.android.application'

android {
    namespace = "app.projelio.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.projelio.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * YAYIN İMZASI.
     *
     * Play'e yüklenecek paket imzalanmak ZORUNDA; imzasız bir AAB kabul
     * edilmiyor. Anahtarın kendisi ve parolası repoda DURMAZ — ikisi de
     * keystore.properties'ten okunuyor (o dosya .gitignore'da) ya da ortam
     * değişkenlerinden (CI için).
     *
     * Dosya yoksa imza yapılandırması hiç kurulmaz: `assembleDebug` ve
     * emülatör akışı etkilenmez, yalnızca yayın paketi üretilemez. Sessizce
     * imzasız bir paket üretip "neden kabul edilmiyor" diye aramaktansa,
     * gradle açıkça "imza yapılandırılmamış" desin diye böyle.
     *
     * Anahtar ÜRETME komutu ve Play App Signing notu: docs/mobil-yayin.md
     */
    signingConfigs {
        release {
            def props = new Properties()
            def dosya = rootProject.file("keystore.properties")
            if (dosya.exists()) {
                dosya.withInputStream { props.load(it) }
            }
            def yol = props['storeFile'] ?: System.getenv('PROJELIO_KEYSTORE')
            if (yol) {
                storeFile file(yol)
                storePassword props['storePassword'] ?: System.getenv('PROJELIO_KEYSTORE_PASSWORD')
                keyAlias props['keyAlias'] ?: System.getenv('PROJELIO_KEY_ALIAS')
                keyPassword props['keyPassword'] ?: System.getenv('PROJELIO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Anahtar tanımlıysa imzala. Tanımlı değilse imzasız üretilir ve
            // Play reddeder — ama yerelde `assembleRelease` ile ölçüm almak
            // (paket boyutu, açılış süresi) yine mümkün kalsın.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // EdgeToEdge (MainActivity) bu kütüphanede. Capacitor'ın kendi şablonunda
    // yok; sürüm numarası variables.gradle'da zaten tanımlıydı.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
