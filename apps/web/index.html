<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3E4858" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Projelio" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Projelio — Freelance Proje & Görev Yönetimi</title>
    <script>
      // Ayarlar > Erişilebilirlik'te seçilen yazı boyutunu, sayfa boyanmadan
      // önce uygula (aksi halde küçük boyutla açılıp sonra büyüyen bir titreme
      // olur). Değerler src/lib/fontScale.ts ile senkron tutulmalı.
      (function () {
        try {
          var v = localStorage.getItem("projelio_font_scale");
          var scale =
            v === "xsmall" ? 0.85 : v === "small" ? 0.92 : v === "large" ? 1.15 : v === "xlarge" ? 1.3 : 1;
          if (scale !== 1) {
            document.documentElement.style.zoom = String(scale);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
