# Projelio production stack.
# Postgres, Supabase Storage, PostgREST, backend, web/Caddy ve landing yığını.

name: projelio

services:
  postgres:
    # Canlı Supabase PostgreSQL 17.6 çalıştırıyor. Aynı ana sürüm dump/restore
    # davranışını ve extension ABI'larını korur; PG15 veri diziniyle kullanma.
    # supabase/postgres already compiles in pg_cron and pgcrypto and preloads
    # pg_cron in its shipped postgresql.conf. shared_preload_libraries only
    # takes effect at server start, so having it baked into the image is the
    # whole reason for choosing this over plain postgres:16.
    image: supabase/postgres:17.6.1.166
    container_name: projelio-postgres
    restart: unless-stopped
    shm_size: 512mb
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # PG17 image initdb'yi supabase_admin ile başlatıp sonra postgres rolünü
      # kendi migration'ında oluşturur. POSTGRES_USER=postgres vermek bu sırayı
      # kırar ve migration daha başlamadan "role supabase_admin does not exist"
      # hatası üretir.
      POSTGRES_USER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuning is passed as -c flags rather than by replacing postgresql.conf:
    # the image own config include-chains wal-g.conf, read-replica.conf and
    # supautils.conf, and swapping the file out breaks that chain. Command-line
    # settings are read last, so these win. The documented rationale for each
    # value lives in postgres.conf next to this file.
    # shared_preload_libraries is deliberately NOT overridden - the image
    # already preloads pg_cron plus the rest of the Supabase extension set.
    command:
      - postgres
      # Point at the image own config explicitly. Without this the entrypoint
      # writes a stock postgresql.conf into the data directory and the image
      # pg_cron preload line is silently lost - CREATE EXTENSION pg_cron then
      # fails with "can only be loaded via shared_preload_libraries".
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - max_connections=200
      - -c
      - superuser_reserved_connections=5
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - temp_buffers=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_statistics_target=100
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - autovacuum=on
      - -c
      - autovacuum_max_workers=3
      - -c
      - autovacuum_naptime=30s
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - cron.database_name=postgres
      - -c
      - timezone=Europe/Istanbul
      - -c
      - log_timezone=Europe/Istanbul
    volumes:
      - /srv/projelio/data/postgres:/var/lib/postgresql/data
      # Reference copy of the tuning rationale; not read by the server.
      - /srv/projelio/deploy/postgres.conf:/etc/postgresql-custom/projelio-overrides.conf:ro
    # Loopback only. Postgres is never reachable from the internet; sibling
    # services will connect over the internal network using the host "postgres".
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - projelio

  storage:
    # Pinned, not :latest. The image carries the storage schema migrations, so
    # bumping the tag silently migrates the database on the next boot.
    # v1.28.4 ships tenant migration 0013-add-bucket-custom-limits (adds
    # max_file_size_kb + allowed_mime_types) and 0014-use-bytes-for-max-size
    # (renames it to file_size_limit, bigint). Both columns are what
    # 063_storage_kova_sinirlari.sql updates in stage D.
    image: supabase/storage-api:v1.28.4
    container_name: projelio-storage
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # --- Database ---
      # Owns and migrates the storage schema. The role is created by hand in
      # stage C, not by this container.
      DATABASE_URL: postgres://supabase_storage_admin:${STORAGE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SUPER_USER: ${POSTGRES_USER}
      # anon / authenticated / service_role already exist from stage B. Left at
      # the default "false" the bundled migration 0002-storage-schema skips its
      # CREATE ROLE block; flipping this to "true" makes it try to create them
      # again and the whole migration run aborts with "role already exists".
      DB_INSTALL_ROLES: "false"
      DB_MIGRATIONS_STRATEGY: on_request

      # --- Auth ---
      # storage-api has no user table: it only verifies that the Bearer token is
      # HMAC-signed with this secret and reads the "role" claim from it. The
      # backend sends a service_role token signed with SUPABASE_JWT_SECRET.
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      AUTH_JWT_ALGORITHM: HS256
      # Left unset on purpose: with no SERVICE_KEY/ANON_KEY the image self-signs
      # both from AUTH_JWT_SECRET at boot, so there is no second copy to keep in
      # sync. The backend mints its own token from the same secret.

      # --- File backend ---
      # Local disk, not S3. Objects land in /srv/projelio/data/storage on the host.
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      # Used as the first path segment even by the file backend. Unset it and
      # every object is stored under a literal "undefined/" directory.
      STORAGE_S3_BUCKET: projelio
      # mtime instead of md5: the default hashes every file on each request to
      # build an ETag, which on a 4-vCPU box is wasted work for cover images.
      STORAGE_FILE_ETAG_ALGORITHM: mtime

      # --- Limits ---
      # Global ceiling. Per-bucket limits are tighter (8 MB, set by migration
      # 063 in stage D); this only has to be above the largest of them. The
      # backend streams anything over 8 MB to Drive/OneDrive, not here.
      FILE_SIZE_LIMIT: 52428800
      TENANT_ID: projelio
      REGION: local

      # --- Disabled subsystems ---
      # No imgproxy container, so image transformation must stay off or every
      # transform request fails at runtime instead of at boot.
      IMAGE_TRANSFORMATION_ENABLED: "false"
      # The S3-compatible protocol surface is a second, separately authenticated
      # entry point Projelio never calls. Off by default here.
      S3_PROTOCOL_ENABLED: "false"
      # pg_boss queue tables are only needed for webhooks / background jobs we
      # do not run; leaving it off keeps the storage schema smaller.
      PG_QUEUE_ENABLE: "false"
    volumes:
      - /srv/projelio/data/storage:/var/lib/storage
    # Loopback only, same rule as Postgres. Public access arrives in stage F
    # through Caddy, which is the only process that gets to listen on 0.0.0.0.
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      # 127.0.0.1, not localhost: inside this image localhost resolves to ::1
      # first, the server only binds IPv4, and wget fails with "connection
      # refused" while the service is in fact healthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - projelio

  postgrest:
    image: postgrest/postgrest:v14.16
    container_name: projelio-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_SERVER_PORT: 3000

      # HAVUZDAKİ BAĞLANTILAR SICAK KALSIN. PostgREST'in varsayılanı 30 sn:
      # bu kadar süre kullanılmayan havuz bağlantısını kapatıyor, sonraki
      # sorgu da yenisini açtırıyor. Bu sunucuda YENİ BİR POSTGRES BAĞLANTISI
      # ~27 ms sürüyor — sorgunun kendisi 0,03 ms.
      #
      # Ölçüm (2026-09-01, ayrı bir PostgREST konteynerinde, Server-Timing
      # açık, 40 sn arayla tek tek istek):
      #   varsayılan 30 sn : 28,6 / 32,3 / 27,7 ms  (transaction 27,2 / 31,1 / 26,2)
      #   bu satırla       : 7,0 / 2,3 / 3,2 / 2,5 / 4,1 ms
      # Gecikmenin tamamı `transaction` diliminde, yani bağlantı edinmede;
      # jwt/parse/plan/response hepsi 0,0-0,1 ms ve pg_stat_statements aynı
      # sorgu için mean_exec_time 0,027 ms gösteriyor.
      #
      # NEDEN BU KADAR SIK OLUYORDU: trafik seyrek. access.service.ts istek
      # başına ~10 ardışık sorgu atıyor; iki kullanıcı hareketi arasında 30 sn
      # geçmesi yetiyordu ve havuz boşalmış oluyordu, sonraki hareket bedeli
      # sorgu sorgu yeniden ödüyordu.
      #
      # 27 MS NEREYE GİDİYOR (pgbench ile, aynı makinede tek kullanımlık bir
      # Postgres üzerinde ayrıştırıldı):
      #   sıcak bağlantıda sorgu              0,08 ms
      #   yeniden bağlan, soket + trust       5,9 ms   (yalnız backend fork)
      #   yeniden bağlan, TCP + scram-sha-256 20,1 ms
      # Yani ağır basan kalem SCRAM el sıkışması (~14 ms) — 4096 turluk PBKDF2
      # bu vCPU'da bu kadar tutuyor. Canlı Postgres'te soket üzerinden yeniden
      # bağlanma 7,8 ms ölçüldü; üstüne TCP+SCRAM ve PostgREST'in oturum
      # hazırlığı binince ~27 ms çıkıyor.
      #
      # ÇÖZÜM NEDEN "BAĞLANTIYI AÇIK TUT": SCRAM'i ucuzlatmanın yolu kimlik
      # doğrulamayı zayıflatmaktan geçer, huge_pages ise yalnızca fork'un
      # 5,9 ms'sine dokunur. Bedeli hiç ödememek en ucuzu.
      #
      # AYRICA: bu, "Caddy üzerinden gitmek yavaş" diye görünen şeyin gerçek
      # sebebiydi — Caddy suçsuz. Havuz sıcakken dönüşümlü ölçüldü (2 koşu ×
      # 8 örnek): caddy üzerinden ortalama 3,3 ve 4,4 ms, doğrudan PostgREST
      # 3,0 ve 2,9 ms. Yani hop'un bedeli sorgu başına 0,3-1,5 ms.
      #
      # Bağlantılar yine de sonsuza kadar yaşamıyor: db-pool-max-lifetime
      # varsayılanı 1800 sn ve ona dokunulmadı — her bağlantı yarım saatte bir
      # yenileniyor, yani sızan bir oturum durumu birikemez.
      PGRST_DB_POOL_MAX_IDLETIME: 1800
    healthcheck:
      test: ["CMD", "postgrest", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [projelio]

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    image: projelio-backend:local
    container_name: projelio-backend
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_healthy
      storage:
        condition: service_healthy
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${APP_JWT_SECRET}
      # İÇ ağ adresi: konteynerler arası konuşma buradan geçer.
      SUPABASE_URL: http://caddy
      # TARAYICIYA verilecek storage adresi. SUPABASE_URL iç ağ adı olduğu için
      # kapak/avatar bağlantıları onunla üretilemez — tarayıcıda çözülmez
      # (bkz. SupabaseService.publicStorageUrl).
      PUBLIC_STORAGE_URL: https://api.projelio.app
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CORS_ORIGINS: https://app.projelio.app
      WEB_APP_URL: https://app.projelio.app
      # WhatsApp köprüsü iç ağ adresi; WAHA'nın backend'e webhook atacağı
      # adres de iç ağdan (Caddy'ye uğramadan) verilir.
      WAHA_URL: http://waha:3000
      WHATSAPP_WEBHOOK_URL: http://backend:3000/whatsapp/webhook
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [projelio]

  waha:
    # WhatsApp köprüsü (bkz. docs/whatsapp-qr-plan.md). Resmi olmayan "Bağlı
    # Cihazlar" protokolünü konuşan tek yer burası; backend ona yalnızca HTTP
    # ile bakar. Protokol kırıldığında backend değil bu konteyner etkilenir,
    # düzeltme de imaj sürümünü yükseltmekten ibarettir. Sürüm bilerek sabit:
    # "latest" bir gece motor davranışını değiştirip oturumu düşürebilir.
    # Etiket şeması motor bazlı (gows-, noweb-, chrome-, latest-<sürüm>); düz
    # "<sürüm>" etiketi YOK — ilk dağıtım bu yüzden düşmüştü. gows-* imajı
    # yalnızca GOWS motorunu taşır; NOWEB'e geçilecekse etiket de noweb-* olur.
    image: devlikeapro/waha:gows-2026.8.2
    container_name: projelio-waha
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Istanbul
      # GOWS: whatsmeow tabanlı Go motoru, tarayıcısız, ~200 MB. Sorun çıkarsa
      # NOWEB'e geçmek entegrasyonu değiştirmez (aynı HTTP API).
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
      # Oturum anahtarları ayrı bir veritabanında (waha rolü, CREATEDB yetkili:
      # WAHA oturum başına kendi veritabanını açar). Dosya volume'u yerine
      # Postgres seçildi ki yedekleme tek kanaldan (pg_dump) yürüsün.
      # sslmode=disable şart: WAHA varsayılan olarak TLS ister, iç ağdaki
      # Postgres TLS konuşmuyor ("The server does not support SSL connections"
      # ile yeniden başlatma döngüsüne girdi, 2026-09-02).
      WHATSAPP_SESSIONS_POSTGRESQL_URL: postgresql://waha:${WAHA_DB_PASSWORD}@postgres:5432/waha?sslmode=disable
      # Konteyner yeniden başlayınca kayıtlı oturumlar kendiliğinden kalksın;
      # yoksa her dağıtımda QR yeniden okutulur.
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # Webhook ayarı burada DEĞİL: backend oturumu açarken kendi webhook
      # adresini ve HMAC anahtarını oturum konfigürasyonuyla verir (kodda
      # sürümlenir, env'e dağılmaz).
      WAHA_PRINT_QR: "false"
    # WhatsApp'a bağlı bir oturumun log satırları numara ve mesaj içeriği
    # taşıyabilir; diskte sınırsız birikmesin.
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ping',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Port yayımlanmıyor ve Caddy'de yolu yok: WAHA'ya yalnızca backend,
    # compose ağı üzerinden (http://waha:3000) ulaşır.
    networks: [projelio]

  caddy:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: https://api.projelio.app
        VITE_GOOGLE_PICKER_API_KEY: ${VITE_GOOGLE_PICKER_API_KEY:-}
        VITE_GOOGLE_PICKER_APP_ID: ${VITE_GOOGLE_PICKER_APP_ID:-}
        VITE_HABIE_URL: ${VITE_HABIE_URL:-}
    image: projelio-web:local
    container_name: projelio-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 443 TLS için, 80 hem yönlendirme hem Let's Encrypt HTTP-01 doğrulaması
    # için açık kalmalı — 80 kapatılırsa sertifika YENİLENEMEZ.
    # 8081 yalnızca 127.0.0.1'e bağlı: yerel geliştirmenin SSH tüneli için,
    # internete kapalı (bkz. Caddyfile'daki :8081 bloğu).
    ports: ["80:80", "443:443", "127.0.0.1:8081:8081"]
    volumes:
      # Sertifika deposu. Kalıcı olmazsa her dağıtımda yeni sertifika istenir
      # ve Let's Encrypt'in haftalık limitine (alan adı başına 5) takılırız —
      # CI/CD her push'ta yeniden dağıttığı için bu günler içinde olurdu.
      - /srv/projelio/data/caddy:/data
      - /srv/projelio/data/caddy-config:/config
    networks: [projelio]

  landing:
    build:
      context: ..
      dockerfile: Dockerfile.landing
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://projelio.app}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.projelio.app}
        NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-}
    image: projelio-landing:local
    container_name: projelio-landing
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO: ${CONTACT_TO:-info@projelio.app}
      CONTACT_FROM: ${CONTACT_FROM:-Projelio <onboarding@resend.dev>}
    # SADECE LOOPBACK. Docker yayınlanan portlar için kendi iptables kurallarını
    # ufw'nin ÖNÜNE koyar, yani "3001:3001" yazmak güvenlik duvarını devre dışı
    # bırakıp Next.js sunucusunu doğrudan internete açıyordu (ölçüldü: dışarıdan
    # 193.111.77.252:3001 yanıt veriyordu — TLS yok, güvenlik başlığı yok,
    # Caddy'nin sağladığı hiçbir koruma yok).
    #
    # Dağıtım betiğinin sağlık kontrolü sunucunun kendisinden çağırdığı için
    # etkilenmiyor; landing ileride Caddy'nin arkasına alındığında da Caddy ona
    # docker ağı üzerinden (landing:3001) ulaşacak, host portuna ihtiyaç yok.
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [projelio]

networks:
  projelio:
    name: projelio
    driver: bridge
