# Projelio production Postgres overrides.
#
# This file is REFERENCE ONLY - it documents why each tuning value was chosen.
# The values are actually applied as -c flags in docker-compose.prod.yml,
# because the supabase/postgres image own postgresql.conf include-chains
# wal-g.conf / read-replica.conf / supautils.conf and replacing the file would
# break that chain. Keep this file and the compose command block in sync.
#
# Host: 4 vCPU / 7.8 GB RAM, shared with backend + redis + storage-api, so the
# values below stay deliberately below what a dedicated DB box would use.
#
# shared_preload_libraries is intentionally NOT set here: the image already
# preloads pg_cron (plus the rest of the Supabase extension set) and that
# setting only applies at server start. Overriding it would drop extensions the
# image expects to be present.

# --- Connections ------------------------------------------------------------
# Generous on purpose: NestJS pool + PostgREST pool + storage-api + ad-hoc psql.
max_connections = 200
superuser_reserved_connections = 5

# --- Memory -----------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 8MB                  # 200 conns * several sort nodes must stay bounded
maintenance_work_mem = 512MB
temp_buffers = 16MB

# --- Write-ahead log --------------------------------------------------------
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Planner ----------------------------------------------------------------
random_page_cost = 1.1          # SSD-backed volume
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallelism ------------------------------------------------------------
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum -------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- Logging ----------------------------------------------------------------
# Disk is the tightest resource on this box, so only slow queries get logged.
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off

# --- Time zone --------------------------------------------------------------
log_timezone = "Europe/Istanbul"
timezone = "Europe/Istanbul"
