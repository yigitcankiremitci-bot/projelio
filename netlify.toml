# TEST KOPYASI — https://projelio-test-kopya.netlify.app
#
# Bu dosya YALNIZCA `test-kopya` dalında böyle. main'deki netlify.toml
# projelio.netlify.app'in yönlendirme sitesini tarif ediyor; bu dal main'e
# birleştirilirse o yönlendirme bozulur ve canlı arayüz yanlış API'ye bakan
# bir paketle değişir. BU DALI MAIN'E BİRLEŞTİRME.
#
# Site bilerek GitHub'a BAĞLI DEĞİL: hiçbir push onu tetiklemez. Yayın yalnızca
# bu klasörden elle gider:
#   npx netlify-cli deploy --build --prod --site projelio-test-kopya
#
# Arkasındaki backend canlı DEĞİL: ayrı Render servisi + ayrı (boş, sahte
# verili) Supabase projesi. Canlıyla tek ortak noktası kaynak kodu.

[build]
  command = "npm run build --workspace=@projelio/shared --if-present && npm run build --workspace=@projelio/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Derleme anında pakete gömülür (bkz. apps/web/vite.config.ts). Test
  # backend'inin adresi; ASLA api.projelio.app olmamalı.
  VITE_API_URL = "https://projelio-test-kopya-api.onrender.com"

# SPA: derin bağlantılar index.html'e düşsün.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Güvenlik başlıkları canlıdaki Caddy ile BİREBİR (deploy/Caddyfile) — testlerin
# canlıyı temsil etmesi için. Tek fark connect-src/frame-src'deki API adresi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Arama motorları test kopyasını dizine eklemesin.
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://projelio-test-kopya-api.onrender.com wss://projelio-test-kopya-api.onrender.com https://www.googleapis.com https://storage.googleapis.com https://graph.microsoft.com https://*.sharepoint.com https://api.onedrive.com; frame-src 'self' https://projelio-test-kopya-api.onrender.com https://docs.google.com https://drive.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.paytr.com; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
