# Projelio artık kendi sunucusunda: https://app.projelio.app
#
# BU SİTE ARTIK UYGULAMAYI SERVİS ETMİYOR. Yalnızca eski adresi bilenleri
# yeni adrese gönderiyor — kullanıcıların yer imleri ve paylaşılmış bağlantılar
# projelio.netlify.app'i gösteriyor, o yüzden burası bir süre daha ayakta
# kalmalı. Birkaç hafta sonra site tamamen kapatılabilir.
#
# Derleme bilerek boş: arayüzü burada üretmeye gerek yok, üstelik üretilseydi
# API adresi yanlış olan (askıya alınmış Render'ı gösteren) bir paket çıkardı.

[build]
  # Her push'ta yeniden derlemenin karşılığı yok: çıktı her seferinde AYNI
  # sabit yönlendirme sayfası. ignore komutu 0 dönünce Netlify derlemeyi iptal
  # edip önceki yayını olduğu gibi bırakıyor — yönlendirme çalışmaya devam
  # ediyor, derleme dakikası (kredi) harcanmıyor.
  # Yalnızca bu dosya değiştiğinde derlenir (git diff fark bulunca 1 döner).
  #
  # ⚠️ AMA: Netlify'daki "projelio" sitesinin GitHub bağlantısı YOK (2026-10-11'de
  # görüldü; son otomatik yayın 2026-09-01). Bu dosyayı push'lamak hiçbir şey
  # yayınlamaz. Kurallar elle yayınlanıyor — aynı kurallar `_redirects` olarak:
  #   npx netlify-cli deploy --dir <klasör> --prod --site f32cb546-82e9-47fc-a71d-4d6aab9b5596
  # Ana klasörde ÇALIŞTIRMA: yerel bağlantısı başka bir siteye (budnal) ait.
  # Kural değişirse bu dosyayı da güncelle ki iki kopya ayrışmasın.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml"

  command = "mkdir -p yonlendirme && printf '%s' '<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=\"0;url=https://app.projelio.app\"><title>Projelio taşındı</title><p>Projelio yeni adresine taşındı: <a href=\"https://app.projelio.app\">app.projelio.app</a>' > yonlendirme/index.html"
  publish = "yonlendirme"

# Kök adres tanıtım sitesine gider, uygulamaya değil. Bu adres aylarca
# uygulamanın adresiydi ve Google'da projelio.app'ten daha güçlü bir izi var;
# o iz giriş ekranına değil tanıtım sitesine aksın (2026-10-11: "projelio"
# aramasında projelio.app çıkmıyordu). İlk eşleşen kural kazanır, bu yüzden
# aşağıdaki joker kuraldan ÖNCE durmalı.
[[redirects]]
  from = "/"
  to = "https://projelio.app/"
  status = 301
  force = true

# force = true şart: dosya eşleşse bile yönlendirme kazansın.
# :splat sayesinde derin bağlantılar korunuyor —
#   projelio.netlify.app/takip/<token>  ->  app.projelio.app/takip/<token>
[[redirects]]
  from = "/*"
  to = "https://app.projelio.app/:splat"
  status = 301
  force = true

# GÜVENLİK BAŞLIKLARI BURADAN KALDIRILDI, kaybolmadı: artık uygulamayı veren
# origin Caddy (bkz. deploy/Caddyfile). Yönlendirmeden ibaret bir sitede
# CSP/HSTS tanımlamanın bir karşılığı yok.
