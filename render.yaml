# Render Blueprint — Projelio TEST KOPYASI backend'i
#
# YALNIZCA test-kopya dalında böyle (main'deki render.yaml askıdaki eski canlı
# servisi tarif ediyor). Bu dal main'e BİRLEŞTİRİLMEZ.
#
# Arayüz: https://projelio-test-kopya.netlify.app (netlify.toml bu servisin
# adresini derlemeye gömüyor — servis adı değişirse orası da değişmeli).
# Veritabanı: eski Supabase `projelio` projesi; gerçek veri silindi, canlının
# şeması + kurgusal demo verisi var (deploy/test-kopya-veritabani.mjs).
#
# Free plan bilerek: ücret istenmiyor. 15 dk boşta kalınca uyur, ilk istek
# ~30 sn sürer; uyurken gece işleri (yenileme, yedek vb.) koşmaz — test için
# sorun değil.
#
# Dış servisler bilerek TANIMSIZ: PayTR canlı, Resend, WhatsApp/WAHA, FCM,
# Shopify, Instagram, Google/Microsoft. Kod tanımsız anahtarda o özelliği
# sessizce kapatıyor; test kopyasından gerçek birine e-posta/mesaj/çekim gitmez.

services:
  - type: web
    name: projelio-test-kopya-api
    runtime: node
    plan: free
    region: frankfurt
    branch: test-kopya
    autoDeploy: false

    buildCommand: npm install && npm run build --workspace=backend
    startCommand: node backend/dist/main
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEB_APP_URL
        value: https://projelio-test-kopya.netlify.app
      - key: CORS_ORIGINS
        value: https://projelio-test-kopya.netlify.app
      - key: BACKEND_URL
        value: https://projelio-test-kopya-api.onrender.com
      - key: API_PUBLIC_URL
        value: https://projelio-test-kopya-api.onrender.com
      - key: WEBAUTHN_RP_ID
        value: projelio-test-kopya.netlify.app
      - key: PAYTR_TEST_MODE
        value: "1"
      - key: AI_PROVIDERS
        value: anthropic
      - key: AI_PROMPT_CACHING
        value: "true"

      # Render kendisi üretir — canlıyla ortak olamaz.
      - key: JWT_SECRET
        generateValue: true
      - key: HESAP_KIMLIK_ENC_KEY
        generateValue: true

      # Gizli: Blueprint formunda elle girilir (~/projelio-test-kopya-render.env).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # İsteğe bağlı: canlınınkinden AYRI, harcama limitli anahtar. Boş
      # bırakılırsa Lio kapalı, uygulamanın geri kalanı çalışır.
      - key: ANTHROPIC_API_KEY
        sync: false
